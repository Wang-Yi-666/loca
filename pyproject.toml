[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loca"
version = "0.1.0"
description = "A lightweight harness for coding agents. Unified tool-use protocol over DeepSeek / OpenAI / Anthropic with streaming, error recovery, and observability."
readme = "README.md"
# Matches the documented requirement ("Python 3.13+") and the interpreter the
# suite is actually run on. The code happens to use nothing newer than 3.11
# syntax, but a floor nobody tests is a promise nobody keeps — so the floor is
# the tested version, not the theoretically sufficient one.
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "loca contributors" }]
keywords = ["agent", "harness", "tool-use", "coding-agent", "llm"]

dependencies = [
    "openai>=1.40.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "jsonschema>=4.21",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
# Only needed to talk to Anthropic. The provider imports it lazily, so the core
# install stays free of a SDK most users never load.
anthropic = ["anthropic>=0.40"]

[project.scripts]
loca = "loca.cli:main"

[tool.setuptools.packages.find]
include = ["loca*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra -q"
markers = [
    # Tests that hit a real provider API. They self-skip when no key is
    # configured, but you can also deselect them explicitly:
    #   pytest -m "not live"
    "live: calls a real provider API (requires a key, costs tokens)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# The eval task set is *fixture* code, not project code. Its seed files carry
# deliberate defects (mutable default arguments, unused variables, wrong
# comparisons) because fixing them is the task, and its graders are written to
# be run inside a sandbox rather than imported here. Linting them would mean
# silencing real findings in the one place they are the point.
extend-exclude = ["loca/eval/tasks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = [
    # ``class Role(str, Enum)`` is deliberate: the str mixin keeps ``.value``
    # as the wire format while staying comparable to plain strings. Switching
    # to StrEnum changes str()/format() behaviour across three protocol types,
    # so we keep the explicit form.
    "UP042",
]