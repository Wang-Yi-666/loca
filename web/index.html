<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>loca — agent chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%235b9cff'/%3E%3Ctext%20x='32'%20y='45'%20font-size='40'%20font-family='monospace'%20font-weight='bold'%20fill='%230e0f13'%20text-anchor='middle'%3El%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #0e0f13;
    --panel: #161821;
    --panel-2: #1d2030;
    --border: #262938;
    --text: #e7e9ee;
    --muted: #8c93a8;
    --accent: #5b9cff;
    --accent-2: #4d8aff;
    --user: #2a3a55;
    --assistant: #1d2030;
    --tool: #2a2238;
    --tool-err: #4d1f24;
    --code: #0b0c10;
    --link: #79b8ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  body { display: flex; flex-direction: column; height: 100vh; }
  header {
    padding: 14px 22px; border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #14161e 0%, #0e0f13 100%);
    display: flex; align-items: center; gap: 12px;
  }
  header .logo {
    width: 26px; height: 26px; border-radius: 7px;
    background: linear-gradient(135deg, var(--accent), #b46bff);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: white;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .health { margin-left: auto; font-size: 12px; color: var(--muted); }
  header .health .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #56d97a; margin-right: 5px; }
  header .health.bad .dot { background: #ff6868; }

  main {
    flex: 1; overflow-y: auto; padding: 24px 0 24px;
    scroll-behavior: smooth;
  }
  .turn {
    max-width: 820px; margin: 0 auto 18px; padding: 0 22px;
  }
  .role {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin-bottom: 4px; font-weight: 600;
  }
  .bubble {
    background: var(--user); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 14px; white-space: pre-wrap;
    word-wrap: break-word; overflow-wrap: anywhere;
  }
  .bubble.assistant { background: var(--assistant); }
  .bubble pre, .bubble code {
    background: var(--code); border-radius: 6px;
    font-family: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    font-size: 12.5px;
  }
  .bubble pre { padding: 10px 12px; overflow-x: auto; margin: 8px 0; }
  .bubble code { padding: 1px 5px; }
  .bubble pre code { padding: 0; background: transparent; }

  .tool-card {
    margin-top: 8px; background: var(--tool); border: 1px solid #3a2f4a;
    border-radius: 10px; padding: 9px 12px; font-size: 12.5px;
  }
  .tool-card.is_error { background: var(--tool-err); border-color: #6e2a30; }
  .tool-card .name { color: #c8a2ff; font-weight: 600; font-family: ui-monospace, monospace; }
  .tool-card .name.tool-err { color: #ff9da3; }
  .tool-card pre {
    background: var(--code); padding: 7px 9px; border-radius: 6px;
    overflow-x: auto; max-height: 220px; margin: 6px 0 0;
    font-family: ui-monospace, monospace; font-size: 12px;
  }

  footer {
    border-top: 1px solid var(--border); padding: 12px 22px 18px;
    background: var(--panel);
  }
  .composer {
    max-width: 820px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 14px; padding: 9px 12px;
  }
  .composer textarea {
    flex: 1; background: transparent; border: 0; outline: 0;
    color: var(--text); resize: none; font: inherit; line-height: 1.5;
    max-height: 180px; min-height: 22px; padding: 4px 0;
  }
  .composer button {
    background: var(--accent); color: white; border: 0;
    width: 34px; height: 34px; border-radius: 9px; cursor: pointer;
    font-size: 16px; display: flex; align-items: center; justify-content: center;
  }
  .composer button:disabled { background: #3a3f4f; cursor: not-allowed; }
  .composer button:hover:not(:disabled) { background: var(--accent-2); }
  .hint { max-width: 820px; margin: 8px auto 0; color: var(--muted); font-size: 11.5px; }

  .typing::after { content: "▍"; animation: blink 1s steps(1) infinite; color: var(--accent); }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<header>
  <div class="logo">L</div>
  <div>
    <h1>loca</h1>
    <div class="sub">a coding-agent harness · streaming · 4 tools</div>
  </div>
  <div class="health" id="health"><span class="dot"></span><span id="health-text">checking…</span></div>
</header>

<main id="messages"></main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask loca to do something… (Enter to send · Shift+Enter for newline)"></textarea>
    <button id="send" title="Send">➤</button>
  </div>
  <div class="hint">Try: <em>List the files in the project and summarize pyproject.toml</em></div>
</footer>

<script>
const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const healthText = document.getElementById("health-text");
const healthEl = document.getElementById("health");

// History: simple in-memory list of {role, content}.
let history = [];

// -- health check -----------------------------------------------------------
fetch("/api/health").then(r => r.json()).then(h => {
  const providers = h.providers_with_keys || [];
  if (providers.length === 0) {
    healthEl.classList.add("bad");
    healthText.textContent = "no API keys in .env";
  } else {
    healthText.textContent = `${providers.join(", ")} ready · workspace ${h.default_workspace.split(/[\\\\/]/).pop()}`;
  }
}).catch(() => {
  healthEl.classList.add("bad");
  healthText.textContent = "server unreachable";
});

// -- helpers ----------------------------------------------------------------
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function renderText(s) {
  // Very small markdown: fenced code blocks + inline code. Avoids a full lib.
  // First escape HTML.
  let out = s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  // Fenced code blocks ```...```
  out = out.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code}</code></pre>`);
  // Inline code `...`
  out = out.replace(/`([^`\n]+)`/g, (_, code) => `<code>${code}</code>`);
  // Newlines → <br>
  out = out.replace(/\n/g, "<br>");
  return out;
}

function appendUserTurn(text) {
  const turn = el("div", "turn");
  turn.appendChild(el("div", "role", "you"));
  const b = el("div", "bubble");
  b.innerHTML = renderText(text);
  turn.appendChild(b);
  messagesEl.appendChild(turn);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function appendAssistantTurn() {
  const turn = el("div", "turn");
  turn.appendChild(el("div", "role", "assistant"));
  const b = el("div", "bubble assistant typing");
  turn.appendChild(b);
  messagesEl.appendChild(turn);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return { turn, bubble: b };
}

function appendToolCard(parentBubble, name, args) {
  const card = el("div", "tool-card");
  const head = el("div");
  head.appendChild(el("span", "name", `🔧 ${name}(`));
  head.appendChild(document.createTextNode(JSON.stringify(args) + ")"));
  card.appendChild(head);
  parentBubble.appendChild(card);
  parentBubble.parentElement.scrollTop = 99999;
  return card;
}

function appendToolResult(parentBubble, name, content, isError) {
  const card = el("div", "tool-card" + (isError ? " is_error" : ""));
  const head = el("div");
  const nm = el("span", "name" + (isError ? " tool-err" : ""),
    (isError ? "✗ " : "✓ ") + name);
  head.appendChild(nm);
  card.appendChild(head);
  const pre = el("pre");
  pre.textContent = content.length > 4000 ? content.slice(0, 4000) + "\n…(truncated)" : content;
  card.appendChild(pre);
  parentBubble.appendChild(card);
  parentBubble.parentElement.scrollTop = 99999;
}

function appendUsageFooter(parentTurn, text) {
  const f = el("div", "role");
  f.textContent = text;
  parentTurn.appendChild(f);
}

function appendError(msg, retryable) {
  const turn = el("div", "turn");
  const b = el("div", "bubble");
  b.style.background = "var(--tool-err)";
  b.textContent = "⚠ " + msg + (retryable ? "  (transient — retries were exhausted)" : "");
  turn.appendChild(b);
  messagesEl.appendChild(turn);
}

function appendNote(text) {
  const turn = el("div", "turn");
  const n = el("div", "role", text);
  turn.appendChild(n);
  messagesEl.appendChild(turn);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// -- streaming --------------------------------------------------------------
async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  appendUserTurn(text);
  history.push({ role: "user", content: text });
  inputEl.value = "";
  sendBtn.disabled = true;

  const { turn, bubble } = appendAssistantTurn();
  let acc = "";
  let currentToolCard = null;
  let lastArgs = null;
  let lastName = null;
  let usageInfo = null;

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, history: history.slice(0, -1) }),
    });
    if (!resp.ok) {
      bubble.classList.remove("typing");
      bubble.textContent = "⚠ HTTP " + resp.status;
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      // sse-starlette terminates lines with \r\n (per the SSE spec);
      // normalize so the blank-line scan below always matches.
      buffer += decoder.decode(value, { stream: true }).replace(/\r\n/g, "\n");
      // SSE: events separated by blank line.
      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const raw = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        // Each event is "event: message\ndata: <json>\n"
        const dataLine = raw.split("\n").find(l => l.startsWith("data: "));
        if (!dataLine) continue;
        const payload = dataLine.slice(6);
        let evt;
        try { evt = JSON.parse(payload); } catch { continue; }
        handle(evt);
      }
    }
  } catch (err) {
    bubble.classList.remove("typing");
    bubble.textContent = "⚠ " + err.message;
  } finally {
    bubble.classList.remove("typing");
    sendBtn.disabled = false;
    inputEl.focus();
  }

  function handle(evt) {
    if (evt.type === "text") {
      acc += evt.content;
      bubble.innerHTML = renderText(acc);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    } else if (evt.type === "tool_call") {
      lastName = evt.name;
      lastArgs = evt.args;
      currentToolCard = appendToolCard(bubble, evt.name, evt.args);
    } else if (evt.type === "tool_result") {
      appendToolResult(bubble, evt.name, evt.content, evt.is_error);
    } else if (evt.type === "usage") {
      usageInfo = evt;
    } else if (evt.type === "done") {
      // Append a footer with stats.
      const stats = [
        `steps: ${evt.steps}`,
        `tokens: ${evt.total_tokens}`,
        `finish: ${evt.reason}`,
      ];
      if (usageInfo) {
        stats.push(`(prompt ${usageInfo.prompt} · completion ${usageInfo.completion})`);
      }
      appendUsageFooter(turn, stats.join("  ·  "));
      history.push({ role: "assistant", content: acc });
    } else if (evt.type === "context_trimmed") {
      appendNote(`context trimmed · dropped ${evt.dropped} old message(s) · ~${evt.estimated_tokens}/${evt.budget} tokens`);
    } else if (evt.type === "recovery") {
      appendNote(`recovering · ${evt.reason} · asking the model to continue`);
    } else if (evt.type === "error") {
      bubble.classList.remove("typing");
      appendError(evt.message, evt.retryable);
    }
  }
}

sendBtn.addEventListener("click", send);
inputEl.addEventListener("keydown", e => {
  if (e.isComposing) return; // IME confirm-Enter must not send (Chinese input).
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
// Fallback for runtimes that deliver Enter without a usable keydown; the
// empty-value guard makes it a no-op when the keydown path already sent.
inputEl.addEventListener("keyup", e => {
  if (e.isComposing) return;
  if (e.key === "Enter" && !e.shiftKey && inputEl.value.trim()) send();
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + "px";
});
</script>
</body>
</html>
