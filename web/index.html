<title>loca — Coding Agent Harness</title>

<!-- Google Fonts: Inter & JetBrains Mono -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg-base: #090b10;
    --bg-surface: #0e121b;
    --bg-elevated: #151b28;
    --bg-card: #182030;
    --bg-hover: #1f2a40;
    --bg-code: #07090f;
    --border-subtle: rgba(255, 255, 255, 0.08);
    --border-medium: rgba(255, 255, 255, 0.14);
    --border-hover: rgba(99, 102, 241, 0.45);
    --border-active: rgba(99, 102, 241, 0.85);

    --primary: #6366f1;
    --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 55%, #d946ef 100%);
    --primary-glow: rgba(99, 102, 241, 0.28);
    
    --cyan: #06b6d4;
    --emerald: #10b981;
    --amber: #f59e0b;
    --rose: #f43f5e;
    --purple: #a855f7;

    --text-primary: #f8fafc;
    --text-secondary: #cbd5e1;
    --text-muted: #8b99ae;
    --text-dim: #5c6b82;

    --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --radius-xl: 22px;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.28);
    --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 12px 36px rgba(0, 0, 0, 0.55);
    --shadow-glow: 0 0 28px rgba(99, 102, 241, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background-color: var(--bg-base);
    color: var(--text-primary);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.6;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    background-image: 
      radial-gradient(ellipse 80% 50% at 50% -15%, rgba(99, 102, 241, 0.16), transparent 70%),
      radial-gradient(circle at 5% 95%, rgba(6, 182, 212, 0.05), transparent 35%),
      radial-gradient(circle at 95% 85%, rgba(168, 85, 247, 0.06), transparent 40%);
  }

  /* Custom Sleek Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.28); }

  /* ================= Header ================= */
  header {
    height: 66px;
    background: rgba(14, 18, 27, 0.82);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    z-index: 50;
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .brand-logo {
    width: 38px;
    height: 38px;
    border-radius: var(--radius-md);
    background: var(--primary-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-glow);
    cursor: pointer;
    transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
  }
  .brand-logo:hover {
    transform: scale(1.06);
    box-shadow: 0 0 32px rgba(99, 102, 241, 0.45);
  }

  .brand-logo svg {
    width: 22px;
    height: 22px;
    color: white;
  }

  .brand-info {
    display: flex;
    flex-direction: column;
  }

  .brand-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-title {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.02em;
    background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .badge-tag {
    font-size: 10px;
    font-family: var(--font-mono);
    padding: 1px 7px;
    border-radius: 999px;
    background: rgba(99, 102, 241, 0.15);
    border: 1px solid rgba(99, 102, 241, 0.35);
    color: #a5b4fc;
    font-weight: 500;
  }

  .brand-sub {
    font-size: 11px;
    color: var(--text-muted);
  }

  .header-center {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    max-width: 520px;
    margin: 0 24px;
  }

  .ws-container {
    width: 100%;
    position: relative;
    display: flex;
    align-items: center;
  }

  .ws-icon {
    position: absolute;
    left: 12px;
    color: var(--text-dim);
    pointer-events: none;
    display: flex;
  }

  .ws-input {
    width: 100%;
    background: rgba(21, 27, 40, 0.85);
    border: 1px solid var(--border-medium);
    border-radius: var(--radius-md);
    padding: 8px 12px 8px 36px;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 12px;
    transition: all 0.2s ease;
  }

  .ws-input:focus {
    outline: none;
    border-color: var(--primary);
    background: var(--bg-card);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    color: var(--text-primary);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 5px 12px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-subtle);
    font-size: 11px;
    color: var(--text-muted);
  }

  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--emerald);
    box-shadow: 0 0 10px var(--emerald);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .pulse-dot.bad {
    background: var(--rose);
    box-shadow: 0 0 10px var(--rose);
  }

  .session-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: var(--radius-sm);
    background: rgba(99, 102, 241, 0.08);
    border: 1px solid rgba(99, 102, 241, 0.22);
    font-family: var(--font-mono);
    font-size: 11px;
    color: #c7d2fe;
    cursor: pointer;
    transition: all 0.2s;
  }
  .session-pill:hover {
    background: rgba(99, 102, 241, 0.16);
    border-color: rgba(99, 102, 241, 0.45);
    color: #fff;
  }

  .btn-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-medium);
    border-radius: var(--radius-sm);
    color: var(--text-secondary);
    padding: 6px 14px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .btn-icon:hover {
    background: rgba(255, 255, 255, 0.09);
    color: #fff;
    border-color: var(--border-hover);
    transform: translateY(-1px);
  }

  /* ================= Main Chat Area ================= */
  main {
    flex: 1;
    overflow-y: auto;
    position: relative;
    padding: 28px 20px 48px;
    display: flex;
    flex-direction: column;
    scroll-behavior: smooth;
  }

  .chat-container {
    width: 100%;
    max-width: 880px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* Welcome Hero */
  .welcome-hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 48px 20px 24px;
    margin-bottom: 8px;
  }

  .welcome-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 16px;
    border-radius: 999px;
    background: rgba(99, 102, 241, 0.12);
    border: 1px solid rgba(99, 102, 241, 0.3);
    color: #a5b4fc;
    font-size: 12px;
    font-weight: 500;
    margin-bottom: 20px;
    animation: fadeInDown 0.6s ease;
  }

  .welcome-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 12px;
    background: linear-gradient(180deg, #ffffff 0%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .welcome-desc {
    max-width: 600px;
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .quick-chips-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    width: 100%;
    max-width: 700px;
  }

  @media (max-width: 680px) {
    .quick-chips-grid { grid-template-columns: 1fr; }
    .header-center { display: none; }
  }

  .quick-chip {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 18px;
    background: rgba(21, 27, 40, 0.65);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md);
    cursor: pointer;
    text-align: left;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .quick-chip:hover {
    background: var(--bg-elevated);
    border-color: var(--border-hover);
    transform: translateY(-2px);
    box-shadow: var(--shadow-sm);
  }

  .quick-chip-icon {
    width: 30px;
    height: 30px;
    border-radius: var(--radius-sm);
    background: rgba(99, 102, 241, 0.14);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #818cf8;
    font-size: 15px;
  }

  .quick-chip-content h4 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 3px;
  }

  .quick-chip-content p {
    font-size: 12px;
    color: var(--text-dim);
  }

  /* Chat Turn */
  .turn {
    display: flex;
    flex-direction: column;
    gap: 8px;
    opacity: 0;
    animation: fadeInUp 0.35s ease forwards;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .turn-header {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .turn-avatar {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
  }
  .turn-avatar.user {
    background: #3b82f6;
    color: white;
  }
  .turn-avatar.assistant {
    background: var(--primary-gradient);
    color: white;
  }

  /* Message Bubble */
  .bubble {
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    position: relative;
    word-break: break-word;
    line-height: 1.65;
  }

  .bubble.user {
    background: linear-gradient(145deg, #182236 0%, #141c2c 100%);
    border: 1px solid rgba(59, 130, 246, 0.28);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    width: 100%;
    color: #e2e8f0;
  }

  .bubble.assistant {
    background: rgba(17, 22, 34, 0.88);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border-medium);
    box-shadow: var(--shadow-md);
    width: 100%;
    color: var(--text-primary);
  }

  /* Dedicated Container for Thinking */
  .thinking-container {
    width: 100%;
    margin-bottom: 12px;
  }

  /* Thinking Box (DeepSeek R1 / Claude 3.7 style) */
  .thinking-box {
    background: rgba(168, 85, 247, 0.06);
    border: 1px solid rgba(168, 85, 247, 0.25);
    border-radius: var(--radius-md);
    overflow: hidden;
    transition: all 0.3s ease;
  }
  .thinking-box.collapsed .thinking-body {
    display: none;
  }
  .thinking-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: rgba(168, 85, 247, 0.09);
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
  }
  .thinking-header:hover {
    background: rgba(168, 85, 247, 0.14);
  }
  .thinking-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    color: #c084fc;
  }
  .thinking-pulse {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #c084fc;
    animation: thinkingPing 1.2s infinite;
  }
  @keyframes thinkingPing {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(192, 132, 252, 0.7); }
    70% { transform: scale(1.1); box-shadow: 0 0 0 6px rgba(192, 132, 252, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(192, 132, 252, 0); }
  }
  .thinking-meta {
    font-size: 11px;
    color: #a855f7;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .thinking-arrow {
    transition: transform 0.2s ease;
  }
  .thinking-box.collapsed .thinking-arrow {
    transform: rotate(-90deg);
  }
  .thinking-body {
    padding: 12px 14px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: #d8b4fe;
    line-height: 1.55;
    white-space: pre-wrap;
    max-height: 280px;
    overflow-y: auto;
    border-top: 1px solid rgba(168, 85, 247, 0.12);
    background: rgba(10, 8, 16, 0.45);
  }

  /* Sequential Flow Container inside Assistant Bubble */
  .flow-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .text-block {
    word-break: break-word;
    line-height: 1.65;
  }

  /* Tool Cards */
  .tool-card {
    border-radius: var(--radius-md);
    background: rgba(15, 20, 32, 0.95);
    border: 1px solid var(--border-medium);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
  }
  .tool-card.is_error {
    border-color: rgba(244, 63, 94, 0.4);
    background: rgba(30, 16, 22, 0.95);
  }

  .tool-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: rgba(255, 255, 255, 0.02);
    border-bottom: 1px solid var(--border-subtle);
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .tool-info {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow: hidden;
  }
  .tool-badge {
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .tool-badge.bash { background: rgba(6, 182, 212, 0.15); color: #22d3ee; }
  .tool-badge.powershell { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
  .tool-badge.read_file { background: rgba(16, 185, 129, 0.15); color: #34d399; }
  .tool-badge.write_file, .tool-badge.edit_file { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
  .tool-badge.default { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; }

  .tool-cmd-preview {
    color: var(--text-secondary);
    font-weight: 500;
    max-width: 480px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tool-status-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-family: var(--font-sans);
    white-space: nowrap;
  }
  .tool-status-badge.running { color: var(--amber); }
  .tool-status-badge.success { color: var(--emerald); }
  .tool-status-badge.failed { color: var(--rose); }

  .tool-body {
    padding: 10px 14px;
    background: var(--bg-code);
  }
  .tool-body pre {
    font-family: var(--font-mono);
    font-size: 12px;
    color: #e2e8f0;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 240px;
    overflow-y: auto;
    line-height: 1.5;
  }

  .tool-actions {
    display: flex;
    justify-content: flex-end;
    padding: 6px 14px;
    background: rgba(255, 255, 255, 0.015);
    border-top: 1px solid var(--border-subtle);
  }
  .copy-btn-mini {
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    border-radius: 4px;
    transition: all 0.15s;
    font-family: var(--font-sans);
  }
  .copy-btn-mini:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.06); }

  /* Checkpoint & Undo Banner */
  .checkpoint-banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 8px 0;
    padding: 10px 16px;
    border-radius: var(--radius-md);
    background: rgba(16, 185, 129, 0.08);
    border: 1px solid rgba(16, 185, 129, 0.25);
    font-size: 12px;
    gap: 12px;
  }
  .checkpoint-desc {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #a7f3d0;
  }
  .checkpoint-files {
    font-family: var(--font-mono);
    color: #34d399;
    font-weight: 500;
  }
  .btn-undo {
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid rgba(16, 185, 129, 0.35);
    color: #6ee7b7;
    border-radius: var(--radius-sm);
    padding: 5px 12px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn-undo:hover:not(:disabled) {
    background: rgba(16, 185, 129, 0.3);
    color: white;
    border-color: #34d399;
    transform: translateY(-1px);
  }
  .btn-undo:disabled { opacity: 0.5; cursor: not-allowed; }

  /* System Banner / Note */
  .sys-note {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    margin: 4px 0;
  }
  .sys-note.info {
    background: rgba(99, 102, 241, 0.08);
    border: 1px solid rgba(99, 102, 241, 0.22);
    color: #a5b4fc;
  }
  .sys-note.warn {
    background: rgba(245, 158, 11, 0.08);
    border: 1px solid rgba(245, 158, 11, 0.22);
    color: #fde68a;
  }
  .sys-note.error {
    background: rgba(244, 63, 94, 0.08);
    border: 1px solid rgba(244, 63, 94, 0.25);
    color: #fca5a5;
  }

  /* Stats Footer */
  .turn-stats {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 4px;
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--font-mono);
  }

  /* Typing Cursor */
  .typing-cursor::after {
    content: "▋";
    color: var(--primary);
    animation: blink 0.9s infinite;
    margin-left: 2px;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  /* Markdown Styles inside Bubbles */
  .bubble h1, .bubble h2, .bubble h3, .bubble h4 {
    margin: 16px 0 8px;
    font-weight: 600;
    color: #fff;
    line-height: 1.35;
  }
  .bubble h1 { font-size: 18px; border-bottom: 1px solid var(--border-subtle); padding-bottom: 6px; }
  .bubble h2 { font-size: 16px; }
  .bubble h3 { font-size: 14px; }
  .bubble p { margin: 8px 0; }
  .bubble ul, .bubble ol { margin: 8px 0 8px 22px; }
  .bubble li { margin: 3px 0; }
  .bubble blockquote {
    border-left: 3px solid var(--primary);
    margin: 8px 0;
    padding: 6px 14px;
    background: rgba(99, 102, 241, 0.06);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    color: var(--text-secondary);
  }
  .bubble a { color: #60a5fa; text-decoration: none; }
  .bubble a:hover { text-decoration: underline; }

  .bubble table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 13px;
  }
  .bubble th, .bubble td {
    border: 1px solid var(--border-medium);
    padding: 6px 12px;
    text-align: left;
  }
  .bubble th { background: rgba(255, 255, 255, 0.05); font-weight: 600; }
  .bubble tr:nth-child(even) { background: rgba(255, 255, 255, 0.02); }

  .bubble code {
    background: rgba(0, 0, 0, 0.45);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 4px;
    padding: 2px 6px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: #f472b6;
  }

  .code-block-wrapper {
    margin: 12px 0;
    border-radius: var(--radius-md);
    background: var(--bg-code);
    border: 1px solid var(--border-medium);
    overflow: hidden;
  }
  .code-block-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 14px;
    background: rgba(255, 255, 255, 0.035);
    border-bottom: 1px solid var(--border-subtle);
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);

  .code-block-wrapper pre {
    padding: 12px 14px;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.5;
    color: #e2e8f0;
    background: transparent;
  }
  .code-block-wrapper pre code {
    padding: 0;
    background: transparent;
    border: none;
    color: inherit;
  }

  /* ================= Footer & Composer ================= */
  footer {
    padding: 16px 24px 24px;
    background: rgba(14, 18, 27, 0.88);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border-subtle);
    flex-shrink: 0;
    z-index: 40;
  }

  .composer-wrapper {
    max-width: 880px;
    margin: 0 auto;

  .composer-card {
    background: rgba(21, 27, 40, 0.96);

    flex-direction: column;
    gap: 8px;
    box-shadow: var(--shadow-lg);
    transition: all 0.25s ease;
  }

  .composer-card:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25), var(--shadow-lg);
    background: rgba(24, 31, 48, 0.98);
  }

  .composer-card textarea {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-family: var(--font-sans);

  .composer-bottom {
    display: flex;

  .composer-hints {

  .kbd-key {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border-subtle);

  .composer-actions {

    gap: 8px;

  .btn-send {
    width: 38px;
    height: 38px;
    border-radius: var(--radius-md);

    border: none;

    justify-content: center;

  .btn-send:hover:not(:disabled) {

  .btn-send:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    background: #232a3d;
    box-shadow: none;
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 95px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(15, 23, 42, 0.95);
    backdrop-filter: blur(14px);
    border: 1px solid var(--border-medium);
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 12px;
    color: #e2e8f0;
    box-shadow: var(--shadow-lg);
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 100;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* SVG Icons utility */
  .icon {
    width: 16px;
    height: 16px;
    stroke-width: 2;
    stroke: currentColor;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
</style>
</head>

<script>
// ================= Global State =================
const messagesEl = document.getElementById("messages");
const chatContainer = document.querySelector(".chat-container");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const healthText = document.getElementById("health-text");
const healthDot = document.getElementById("health-dot");
const healthEl = document.getElementById("health");
const workspaceEl = document.getElementById("workspace");
const sessionEl = document.getElementById("session");
const sessionText = document.getElementById("session-text");
const welcomeHero = document.getElementById("welcome-hero");
const btnNewChat = document.getElementById("btn-new-chat");
const toastEl = document.getElementById("toast");

let history = [];
let sessionId = null;
let lastWorkspace = null;
let isStreaming = false;

// ================= Utilities =================
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(() => toastEl.classList.remove("show"), 2200);
}

function escapeHtml(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function copyToClipboard(text, successMsg = "已复制到剪贴板") {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast(successMsg));
  } else {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    showToast(successMsg);
  }
}

// Global click delegation for all copy buttons
document.addEventListener("click", (e) => {
  const btn = e.target.closest(".copy-btn-mini");
  if (btn && btn.dataset.copy) {
    copyToClipboard(decodeURIComponent(btn.dataset.copy));
  }
});

// Lightweight robust Markdown parser
function parseMarkdown(md) {
  if (!md) return "";
  let text = escapeHtml(md);

  // 1. Code blocks with language and copy button: ```lang\ncode\n```
  text = text.replace(/```([a-zA-Z0-9_\-\+]*)\n([\s\S]*?)```/g, (match, lang, code) => {
    const langLabel = lang ? lang.trim() : "code";
    const rawCode = code.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#039;/g, "'");
    const escapedAttr = encodeURIComponent(rawCode);
    return `<div class="code-block-wrapper">
      <div class="code-block-header">
        <span>${langLabel}</span>
        <button class="copy-btn-mini" data-copy="${escapedAttr}">
          <svg viewBox="0 0 24 24" class="icon" style="width:12px;height:12px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          复制
        </button>
      </div>
      <pre><code>${code}</code></pre>
    </div>`;
  });

  // 2. Inline code: `code`
  text = text.replace(/`([^`\n]+)`/g, "<code>$1</code>");

  // 3. Headings (# H1, ## H2, ### H3)
  text = text.replace(/^### (.*$)/gim, "<h3>$1</h3>");
  text = text.replace(/^## (.*$)/gim, "<h2>$1</h2>");
  text = text.replace(/^# (.*$)/gim, "<h1>$1</h1>");

  // 4. Blockquotes
  text = text.replace(/^\> (.*$)/gim, "<blockquote>$1</blockquote>");

  // 5. Bold & Italic
  text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  text = text.replace(/~~([^~]+)~~/g, "<del>$1</del>");

  // 6. Unordered lists: - item or * item
  text = text.replace(/^\s*[\-\*]\s+(.*$)/gim, "<ul><li>$1</li></ul>");
  text = text.replace(/<\/ul>\s*<ul>/g, "");

  // 7. Ordered lists: 1. item
  text = text.replace(/^\s*\d+\.\s+(.*$)/gim, "<ol><li>$1</li></ol>");
  text = text.replace(/<\/ol>\s*<ol>/g, "");

  // 8. Markdown Links: [text](url)
  text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

  // 9. Newlines to <br> outside code blocks
  const parts = text.split(/(<div class="code-block-wrapper">[\s\S]*?<\/div>)/g);
  for (let i = 0; i < parts.length; i++) {
    if (!parts[i].startsWith('<div class="code-block-wrapper">')) {
      parts[i] = parts[i].replace(/\n/g, "<br>");
    }
  }
  return parts.join("");
}

// ================= Health Check =================
fetch("/api/health")
  .then(r => r.json())
  .then(h => {
    if (!workspaceEl.value && h.default_workspace) {
      workspaceEl.value = h.default_workspace;
    }
    const providers = h.providers_with_keys || [];
    if (providers.length === 0) {
      healthDot.classList.add("bad");
      healthText.textContent = "未配置 API Key";
      healthEl.title = "请在 .env 中配置 LOCA_DEEPSEEK_API_KEY 等凭据";
    } else {
      healthDot.classList.remove("bad");
      const names = providers.map(p => p === "deepseek" ? "DeepSeek" : p === "openai" ? "OpenAI" : "Anthropic");
      healthText.textContent = `${names.join(" · ")} 就绪`;
      healthEl.title = `已加载模型服务: ${names.join(", ")}`;
    }
  })
  .catch(() => {
    healthDot.classList.add("bad");
    healthText.textContent = "服务器连接中断";
  });

// ================= Session Management =================
function setSession(id) {
  sessionId = id || null;
  if (id) {
    sessionEl.style.display = "flex";
    sessionText.textContent = id.length > 12 ? id.slice(0, 10) + "…" : id;
    sessionEl.title = `会话 ID: ${id} (点击复制)\n命令行断点续聊: loca sessions show ${id}\n快照回滚: loca rollback ${id} <step>`;
  } else {
    sessionEl.style.display = "none";
    sessionText.textContent = "";
  }
}

sessionEl.addEventListener("click", () => {
  if (sessionId) copyToClipboard(sessionId, `已复制会话 ID: ${sessionId}`);
});

btnNewChat.addEventListener("click", () => {
  if (isStreaming) return;
  if (history.length > 0 && !confirm("开启新对话将重置当前聊天界面并开启全新会话，是否继续？")) return;
  sessionId = null;
  setSession(null);
  history = [];
  
  // Clear messages except welcome
  chatContainer.innerHTML = "";
  chatContainer.appendChild(welcomeHero);
  welcomeHero.style.display = "flex";
  showToast("已重置并就绪全新会话");
});

// Quick chips click binding
document.querySelectorAll(".quick-chip").forEach(chip => {
  chip.addEventListener("click", () => {
    const prompt = chip.getAttribute("data-prompt");
    if (prompt) {
      inputEl.value = prompt;
      inputEl.focus();
      send();
    }
  });
});

// Auto-grow textarea
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + "px";
});

// ================= DOM Turn Renderers =================
function appendUserTurn(text) {
  welcomeHero.style.display = "none";
  const turn = document.createElement("div");
  turn.className = "turn";

  const head = document.createElement("div");
  head.className = "turn-header";
  head.innerHTML = `
    <span class="turn-avatar user">👤</span>
    <span>用户 / YOU</span>
  `;

  const bubble = document.createElement("div");
  bubble.className = "bubble user";
  bubble.innerHTML = parseMarkdown(text);

  turn.appendChild(head);
  turn.appendChild(bubble);
  chatContainer.appendChild(turn);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function appendAssistantTurn() {
  const turn = document.createElement("div");
  turn.className = "turn";

  const head = document.createElement("div");
  head.className = "turn-header";
  head.innerHTML = `
    <span class="turn-avatar assistant">⚡</span>
    <span>LOCA AGENT</span>
  `;

  const bubble = document.createElement("div");
  bubble.className = "bubble assistant typing-cursor";

  const thinkingContainer = document.createElement("div");
  thinkingContainer.className = "thinking-container";

  const flowContainer = document.createElement("div");
  flowContainer.className = "flow-container";

  bubble.appendChild(thinkingContainer);
  bubble.appendChild(flowContainer);

  turn.appendChild(head);
  turn.appendChild(bubble);
  chatContainer.appendChild(turn);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  return { turn, bubble, thinkingContainer, flowContainer };
}

// Real-time Thinking Box Component (Collapsed by default)
function createThinkingBox(container) {
  const box = document.createElement("div");
  box.className = "thinking-box collapsed";

  const head = document.createElement("div");
  head.className = "thinking-header";
  head.innerHTML = `
    <div class="thinking-title">
      <span class="thinking-pulse"></span>
      <span>思考过程</span>
    </div>
    <div class="thinking-meta">
      <span class="thinking-status" data-done="false">思考中… (点击展开)</span>
      <svg viewBox="0 0 24 24" class="icon thinking-arrow" style="width:12px;height:12px;"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
  `;

  const body = document.createElement("div");
  body.className = "thinking-body";

  head.addEventListener("click", () => {
    box.classList.toggle("collapsed");
    const isCollapsed = box.classList.contains("collapsed");
    const statusSpan = head.querySelector(".thinking-status");
    if (statusSpan) {
      const isDone = statusSpan.dataset.done === "true";
      if (isDone) {
        statusSpan.textContent = isCollapsed ? "思考完成 (点击展开)" : "思考完成 (点击收起)";
      } else {
        statusSpan.textContent = isCollapsed ? "思考中… (点击展开)" : "思考中… (点击收起)";
      }
    }
  });

  box.appendChild(head);
  box.appendChild(body);
  container.appendChild(box);
  return { box, body, head };
}

// Tool Call Card
function appendToolCard(container, name, args) {
  const card = document.createElement("div");
  card.className = "tool-card";

  let badgeClass = "default";
  let toolIcon = "🔧";
  if (name === "bash") { badgeClass = "bash"; toolIcon = "🖥️"; }
  else if (name === "powershell") { badgeClass = "powershell"; toolIcon = "$_"; }
  else if (name === "read_file") { badgeClass = "read_file"; toolIcon = "📄"; }
  else if (name === "write_file" || name === "edit_file") { badgeClass = "write_file"; toolIcon = "✏️"; }

  let previewText = "";
  if (name === "bash" || name === "powershell") {
    previewText = args.command || "";
  } else if (name === "read_file" || name === "write_file" || name === "edit_file") {
    previewText = args.path || "";
  } else {
    previewText = JSON.stringify(args);
  }

  card.innerHTML = `
    <div class="tool-head">
      <div class="tool-info">
        <span class="tool-badge ${badgeClass}">${toolIcon} ${escapeHtml(name)}</span>
        <span class="tool-cmd-preview" title="${escapeHtml(previewText)}">${escapeHtml(previewText)}</span>
      </div>
      <div class="tool-status-badge running">
        <svg viewBox="0 0 24 24" class="icon" style="width:12px;height:12px;animation:spin 1s linear infinite;"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>
        <span>执行中…</span>
      </div>
    </div>
  `;

  container.appendChild(card);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return card;
}

// Tool Result Card update or insert
function updateOrCreateToolResult(container, currentCard, name, content, isError) {
  let card = currentCard;
  if (!card) {
    card = document.createElement("div");
    container.appendChild(card);
  }
  card.className = "tool-card" + (isError ? " is_error" : "");

  let badgeClass = name === "bash" ? "bash" : name === "powershell" ? "powershell" : name === "read_file" ? "read_file" : "write_file";
  const displayContent = content.length > 5000 ? content.slice(0, 5000) + "\n…(输出过长，已折叠截断)" : content;
  const encodedContent = encodeURIComponent(content);

  card.innerHTML = `
    <div class="tool-head">
      <div class="tool-info">
        <span class="tool-badge ${badgeClass}">${isError ? "✗" : "✓"} ${escapeHtml(name)}</span>
        <span class="tool-cmd-preview">输出结果 (${content.length} 字符)</span>
      </div>
      <div class="tool-status-badge ${isError ? "failed" : "success"}">
        <span>${isError ? "执行失败" : "执行成功"}</span>
      </div>
    </div>
    <div class="tool-body">
      <pre>${escapeHtml(displayContent)}</pre>
    </div>
    <div class="tool-actions">
      <button class="copy-btn-mini" data-copy="${encodedContent}">
        <svg viewBox="0 0 24 24" class="icon" style="width:12px;height:12px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        复制输出
      </button>
    </div>
  `;

  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// Checkpoint note with rollback button
function appendCheckpointNote(evt) {
  const turn = document.createElement("div");
  turn.className = "turn";

  const banner = document.createElement("div");
  banner.className = "checkpoint-banner";

  const files = (evt.files || []).join(", ") || "无变更";
  const restorableTag = evt.restorable ? "" : " (文件过大未做物理快照)";

  banner.innerHTML = `
    <div class="checkpoint-desc">
      <svg viewBox="0 0 24 24" class="icon" style="color:#10b981;flex-shrink:0;"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      <div>
        <strong>快照记录 @ Step ${evt.step}</strong> · 
        <span class="checkpoint-files">${escapeHtml(files)}</span>${restorableTag}
      </div>
    </div>
  `;

  const btn = document.createElement("button");
  btn.className = "btn-undo";
  btn.innerHTML = `
    <svg viewBox="0 0 24 24" class="icon" style="width:13px;height:13px;"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
    <span>回滚至该步骤</span>
  `;
  btn.title = `安全撤销 Step ${evt.step} 及之后的所有文件写入与修改（物理恢复旧版本或删除新创建文件）`;
  btn.addEventListener("click", () => undoToStep(evt.step, btn));

  banner.appendChild(btn);
  turn.appendChild(banner);
  chatContainer.appendChild(turn);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function undoToStep(step, button) {
  if (!sessionId) {
    appendSystemNote("info", "当前无活跃会话，请先进行对话生成修改");
    return;
  }
  const ok = window.confirm(
    `【确认文件快照回滚】\n\n` +
    `确定要撤销 Step ${step} 及其之后的所有文件变动吗？\n\n` +
    `• 本会话在该步骤之后写入或修改的文件将被还原为修改前的快照状态。\n` +
    `• 本会话新建的文件将被彻底安全删除。\n` +
    `• Shell 外部环境改动不在此快照管理范围内。`
  );
  if (!ok) return;

  button.disabled = true;
  button.innerHTML = `<span>回滚执行中…</span>`;

  try {
    const resp = await fetch("/api/rollback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, step: step }),
    });
    const out = await resp.json();
    if (!out.ok) {
      appendSystemNote("warn", `回滚未生效: ${out.message}`);
      return;
    }
    const parts = (out.files || []).map(f =>
      f.action === "restored" ? `还原 ${f.path}`
        : f.action === "deleted" ? `删除新建 ${f.path}`
          : `跳过 ${f.path}`);
    
    appendSystemNote("info", `✓ 成功回滚 ${out.applied} 个快照节点 (Step ${out.step} 之后) · ${parts.length ? parts.join(" · ") : "工作区状态与历史快照一致"}`);
    showToast("快照回滚完成！磁盘文件已还原");
  } catch (err) {
    appendSystemNote("error", `回滚请求异常: ${err.message}`);
  } finally {
    button.disabled = false;
    button.innerHTML = `
      <svg viewBox="0 0 24 24" class="icon" style="width:13px;height:13px;"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
      <span>已完成回滚</span>
    `;
  }
}

function appendSystemNote(level, text) {
  const turn = document.createElement("div");
  turn.className = "turn";
  const note = document.createElement("div");
  note.className = `sys-note ${level}`;
  note.innerHTML = `
    <svg viewBox="0 0 24 24" class="icon" style="width:14px;height:14px;flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span>${escapeHtml(text)}</span>
  `;
  turn.appendChild(note);
  chatContainer.appendChild(turn);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function appendTurnStats(parentTurn, statsText) {
  const stats = document.createElement("div");
  stats.className = "turn-stats";
  stats.innerHTML = `
    <svg viewBox="0 0 24 24" class="icon" style="width:12px;height:12px;flex-shrink:0;"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    <span>${escapeHtml(statsText)}</span>
  `;
  parentTurn.appendChild(stats);
}

// ================= SSE Chat Stream =================
async function send() {
  if (isStreaming) return;
  const text = inputEl.value.trim();
  if (!text) return;

  const ws = workspaceEl.value.trim();
  if (ws && ws !== lastWorkspace) {
    appendSystemNote("info", `工作空间重定向 · ${ws}`);
    lastWorkspace = ws;
  }

  appendUserTurn(text);
  history.push({ role: "user", content: text });
  inputEl.value = "";
  inputEl.style.height = "auto";
  sendBtn.disabled = true;
  isStreaming = true;

  const { turn, bubble, thinkingContainer, flowContainer } = appendAssistantTurn();
  let reasoningAccumulator = "";
  let thinkingComponent = null;
  let currentTextBlockEl = null;
  let currentTextRaw = "";
  let fullAssistantText = "";
  let usageInfo = null;
  let currentToolCard = null;

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        history: history.slice(0, -1),
        workspace: ws || null,
        session_id: sessionId,
      }),
    });

    if (!resp.ok) {
      bubble.classList.remove("typing-cursor");
      bubble.textContent = `⚠ 服务请求异常: HTTP ${resp.status} (${resp.statusText})`;
      return;
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true }).replace(/\r\n/g, "\n");
      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const raw = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);

        const dataLine = raw.split("\n").find(l => l.startsWith("data: "));
        if (!dataLine) continue;
        const payload = dataLine.slice(6);
        let evt;
        try { evt = JSON.parse(payload); } catch { continue; }
        handleEvent(evt);
      }
    }
  } catch (err) {
    bubble.classList.remove("typing-cursor");
    appendSystemNote("error", `通信中断: ${err.message}`);
  } finally {
    bubble.classList.remove("typing-cursor");
    sendBtn.disabled = false;
    isStreaming = false;
    inputEl.focus();
  }

  function flushThinkingState() {
    if (thinkingComponent && reasoningAccumulator) {
      const statusSpan = thinkingComponent.head.querySelector(".thinking-status");
      if (statusSpan) {
        statusSpan.dataset.done = "true";
        statusSpan.textContent = thinkingComponent.box.classList.contains("collapsed")
          ? "思考完成 (点击展开)"
          : "思考完成 (点击收起)";
      }
      const pulse = thinkingComponent.head.querySelector(".thinking-pulse");
      if (pulse) pulse.style.animation = "none";
    }
  }

  function handleEvent(evt) {
    if (evt.type === "session") {
      setSession(evt.id);
    } else if (evt.type === "reasoning") {
      if (!thinkingComponent) {
        thinkingComponent = createThinkingBox(thinkingContainer);
      }
      reasoningAccumulator += evt.content;
      thinkingComponent.body.textContent = reasoningAccumulator;
      thinkingComponent.body.scrollTop = thinkingComponent.body.scrollHeight;
      // Do not auto-scroll outer viewport while reasoning is collapsed to prevent jitter
    } else if (evt.type === "text") {
      flushThinkingState();
      fullAssistantText += evt.content;
      currentTextRaw += evt.content;

      if (!currentTextBlockEl) {
        currentTextBlockEl = document.createElement("div");
        currentTextBlockEl.className = "text-block";
        flowContainer.appendChild(currentTextBlockEl);
      }
      currentTextBlockEl.innerHTML = parseMarkdown(currentTextRaw);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    } else if (evt.type === "tool_call") {
      flushThinkingState();

      // Clean up any pure English preamble emitted before tool call in a Chinese conversation
      const userIsChinese = /[\u4e00-\u9fa5]/.test(text);
      if (userIsChinese && currentTextBlockEl && currentTextRaw && !/[\u4e00-\u9fa5]/.test(currentTextRaw)) {
        currentTextBlockEl.remove();
        currentTextBlockEl = null;
        if (fullAssistantText.endsWith(currentTextRaw)) {
          fullAssistantText = fullAssistantText.slice(0, fullAssistantText.length - currentTextRaw.length);
        }
      }

      currentTextBlockEl = null;
      currentTextRaw = "";

      // Do not display bash or powershell process cards
      if (evt.name !== "bash" && evt.name !== "powershell") {
        currentToolCard = appendToolCard(flowContainer, evt.name, evt.args);
      } else {
        currentToolCard = null;
      }
    } else if (evt.type === "tool_result") {
      if (evt.name !== "bash" && evt.name !== "powershell" && currentToolCard) {
        updateOrCreateToolResult(flowContainer, currentToolCard, evt.name, evt.content, evt.is_error);
      }
      currentToolCard = null;
      currentTextBlockEl = null;
      currentTextRaw = "";
    } else if (evt.type === "usage") {
      usageInfo = evt;
    } else if (evt.type === "checkpoint") {
      appendCheckpointNote(evt);
    } else if (evt.type === "context_trimmed") {
      appendSystemNote("info", `⚡ 上下文修剪：自动丢弃 ${evt.dropped} 条旧消息以保持 token 预算 (~${evt.estimated_tokens}/${evt.budget} tokens)`);
    } else if (evt.type === "context_summarized") {
      appendSystemNote("info", `⚡ 上下文摘要压缩：已将 ${evt.summarized} 条历史消息归纳压缩 (~${evt.summary_tokens} tokens, 总量: ~${evt.estimated_tokens}/${evt.budget})`);
    } else if (evt.type === "recovery") {
      appendSystemNote("warn", evt.reason === "length" 
        ? "⚡ 检测到输出达到上限，Agent 正在自动触发接续 (Recovery)..." 
        : `⚡ 提供商偶发故障 (${evt.detail || evt.reason})，正在自动重试...`);
    } else if (evt.type === "error") {
      bubble.classList.remove("typing-cursor");
      appendSystemNote("error", `执行错误: ${evt.message}${evt.retryable ? " (重试次数耗尽)" : ""}`);
    } else if (evt.type === "done") {
      flushThinkingState();
      bubble.classList.remove("typing-cursor");
      const parts = [
        `执行步数: ${evt.steps}`,
        `总 Tokens: ${evt.total_tokens}`,
        `结束状态: ${evt.reason === "stop" ? "完成" : evt.reason}`,
      ];
      if (usageInfo) {
        parts.push(`(Prompt: ${usageInfo.prompt} · Completion: ${usageInfo.completion})`);
      }
      appendTurnStats(turn, parts.join("  ·  "));
      history.push({ role: "assistant", content: fullAssistantText });
    }
  }
}

// ================= Event Listeners =================
sendBtn.addEventListener("click", send);

inputEl.addEventListener("keydown", e => {
  if (e.isComposing) return; // Support Chinese IME confirm Enter
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

inputEl.addEventListener("keyup", e => {
  if (e.isComposing) return;
  if (e.key === "Enter" && !e.shiftKey && inputEl.value.trim() && !isStreaming) {
    send();
  }
});

// Logo click resets to welcome state if empty
document.getElementById("btn-logo").addEventListener("click", () => {
  if (history.length === 0) {
    welcomeHero.style.display = "flex";
  }
});
</script>
